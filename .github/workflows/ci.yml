name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # No lockfile is committed: this repo is a standalone package, so let
      # pnpm resolve fresh.
      - run: pnpm install
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm test
      # The committed lib/ must stay in sync with src/ — fail if a build
      # produces a diff, so GitHub-based installs never get stale output.
      - run: git diff --exit-code -- lib/
